[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parangonar"
version = "3.3.2b"
description = "Music Alignment"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = ["match", "alignment", "midi", "performance", "score"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]

authors = [
  { name = "Silvan Peter" }
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "partitura",
]

[project.optional-dependencies]
accelerated = [
  "torch",
  "numba",
  "symusic",
  "miditok",
]


[project.urls]
Homepage = "https://github.com/sildater/parangonar"

[tool.setuptools]
# package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
# where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
parangonar = [
  "assets/mozart_k265_var1.match",
  "assets/alignment_transformer_checkpoint.pt",
  "assets/thegluenote_small_checkpoint.pt",
]
